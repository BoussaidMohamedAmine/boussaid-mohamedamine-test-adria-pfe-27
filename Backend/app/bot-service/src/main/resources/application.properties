spring.application.name=bot-service

# locally
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=granite4.1:8b

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8050

# Adresse du serveur Eureka
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.jersey.enabled=false
eureka.instance.prefer-ip-address=true

spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8010
spring.ai.mcp.client.streamable-http.connections.account.endpoint=/mcp

spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8020
spring.ai.mcp.client.streamable-http.connections.transaction.endpoint=/mcp